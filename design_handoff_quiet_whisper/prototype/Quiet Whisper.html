<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quiet Whisper</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2a2822; }
  #root { height: 100%; }

  /* Mac window shell surrounding the app */
  .qw-shell {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at top, #3a362c 0%, #1e1c16 60%, #141109 100%);
    padding: 30px;
  }
  .qw-window {
    width: min(1180px, 100%);
    height: min(780px, 100%);
    border-radius: 14px; overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 30px 60px rgba(0,0,0,0.55),
      0 8px 24px rgba(0,0,0,0.35);
    position: relative;
    background: #f6f4ef;
  }

  /* Traffic lights fixed to top-left of the window, always visible */
  .qw-traffic {
    position: absolute; top: 14px; left: 18px;
    display: flex; gap: 8px; z-index: 100;
  }
  .qw-traffic span {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block;
    box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15);
  }
  .qw-traffic .r { background: #ff5f57; }
  .qw-traffic .y { background: #febc2e; }
  .qw-traffic .g { background: #28c840; }

  /* Keyframes */
  @keyframes qw-pulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.25); }
  }
  @keyframes qw-fade {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes qw-rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Textareas: ensure placeholder + caret play nice with ink color */
  textarea::placeholder { color: #b5b0a4; opacity: 1; }
  textarea { caret-color: currentColor; }

  /* Scrollbars: soft */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.22); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="qw-tokens.jsx"></script>
<script type="text/babel" src="qw-wave.jsx"></script>
<script type="text/babel" src="qw-sidebar.jsx"></script>
<script type="text/babel" src="qw-app.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "ink",
    "readingFont": "fraunces",
    "readingSize": 18,
    "density": "regular",
    "waveStyle": "dots",
    "waveSensitivity": 1,
    "dark": false
  }/*EDITMODE-END*/;

  function AppShell() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <div className="qw-shell">
        <div className="qw-window" data-screen-label="Quiet Whisper">
          <div className="qw-traffic">
            <span className="r" />
            <span className="y" />
            <span className="g" />
          </div>
          <QuietWhisper tweaks={t} />
        </div>
        <TweaksPanel title="Tweaks">
          <TweakSection label="Theme" />
          <TweakRadio label="Accent" value={t.accent}
            options={[
              { value: 'ink',    label: 'Ink' },
              { value: 'coral',  label: 'Coral' },
              { value: 'sage',   label: 'Sage' },
              { value: 'indigo', label: 'Indigo' },
            ]}
            onChange={(v) => setTweak('accent', v)} />

          <TweakSection label="Reading" />
          <TweakSelect label="Font" value={t.readingFont}
            options={[
              { value: 'fraunces', label: 'Fraunces' },
              { value: 'iowan',    label: 'Iowan Old Style' },
              { value: 'georgia',  label: 'Georgia' },
            ]}
            onChange={(v) => setTweak('readingFont', v)} />
          <TweakSlider label="Body size" value={t.readingSize}
            min={15} max={24} step={1} unit="px"
            onChange={(v) => setTweak('readingSize', v)} />
          <TweakRadio label="Density" value={t.density}
            options={['compact', 'regular', 'comfy']}
            onChange={(v) => setTweak('density', v)} />

          <TweakSection label="Waveform" />
          <TweakRadio label="Style" value={t.waveStyle}
            options={[
              { value: 'dots',  label: 'Dots' },
              { value: 'bars',  label: 'Bars' },
              { value: 'blob',  label: 'Blob' },
            ]}
            onChange={(v) => setTweak('waveStyle', v)} />
          <TweakSlider label="Sensitivity" value={t.waveSensitivity}
            min={0.4} max={2.0} step={0.1}
            onChange={(v) => setTweak('waveSensitivity', v)} />
        </TweaksPanel>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<AppShell />);
</script>
</body>
</html>
