name: QuietWhisper
options:
  bundleIdPrefix: app.quietwhisper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: QuietWhisper/QuietWhisper.entitlements
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: QuietWhisper/Info.plist

targets:
  QuietWhisper:
    type: application
    platform: macOS
    sources:
      - path: QuietWhisper
        excludes:
          - "Info.plist"
          - "QuietWhisper.entitlements"
    resources:
      - path: QuietWhisper/Resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: QuietWhisper/Info.plist
      properties:
        CFBundleDisplayName: Quiet Whisper
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Quiet Whisper transcribes audio on this device. Nothing leaves your Mac."
        NSHighResolutionCapable: true
        ATSApplicationFontsPath: "Fonts"

  QuietWhisperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QuietWhisperTests
    dependencies:
      - target: QuietWhisper
